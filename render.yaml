services:
  - type: web
    name: discord-v1-alkh
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:dashboard
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: DASHBOARD_AUTH
        value: "true"
      - key: DASHBOARD_SECURE
        value: "true"
      - key: DASHBOARD_URL
        value: https://discord-v1-alkh.onrender.com
      - key: DISCORD_REDIRECT_URI
        value: https://discord-v1-alkh.onrender.com/api/auth/discord/callback
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: OWNER_ID
        sync: false
