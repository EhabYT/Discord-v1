name: CI

# The security suites are only worth having if something runs them without
# being asked. This workflow is the enforcement point for every gate the audit
# put in place: lint ratchet, 126 security assertions, and a reproducible
# dashboard build.
#
# No Discord token or secrets are required — the suites drive the real Express
# stack against a mocked Discord client, so CI needs nothing beyond Node.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run obsolete; don't burn minutes on it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # engines.node is >=22.12.0 — @discordjs/voice will not run on Node 20.
      # Pinning the major here means CI fails loudly if that constraint drifts,
      # rather than silently testing an unsupported runtime.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/client/package-lock.json

      - name: Verify Node satisfies package.json engines
        run: node -e "
          const {engines}=require('./package.json');
          const semver=process.versions.node;
          const need=engines.node.replace('>=','').split('.').map(Number);
          const have=semver.split('.').map(Number);
          const ok=have[0]>need[0]||(have[0]===need[0]&&(have[1]>need[1]||(have[1]===need[1]&&have[2]>=need[2])));
          if(!ok){console.error('Node '+semver+' does not satisfy '+engines.node);process.exit(1);}
          console.log('Node '+semver+' satisfies '+engines.node);"

      # --ignore-scripts skips the postinstall rebuild so we can run it as its
      # own step; a native-module failure should be an obvious red step, not a
      # confusing install error.
      - name: Install server dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild better-sqlite3 (native)
        run: npm rebuild better-sqlite3

      - name: Verify native module loads
        run: node -e "new (require('better-sqlite3'))(':memory:'); console.log('better-sqlite3 OK')"

      - name: Lint gate (ratchet — fails if problems increase)
        run: npm run lint:gate

      - name: Syntax check every source file
        run: |
          fail=0
          while IFS= read -r f; do
            node --check "$f" 2>/dev/null || { echo "SYNTAX ERROR: $f"; fail=1; }
          done < <(find . -path ./node_modules -prune -o -path ./dashboard/public -prune \
                        -o -path ./dashboard/client/node_modules -prune -o -name '*.js' -print)
          exit $fail

      # 126 assertions across eight suites. Each asserts both that a request is
      # rejected AND that no privileged side effect occurred.
      - name: Security and regression suites
        run: npm test

      - name: Install dashboard client dependencies
        run: npm ci --prefix dashboard/client

      - name: Build dashboard
        run: npm run build:dashboard

      # The built SPA is committed. If a source change was made without
      # rebuilding, the deployed dashboard silently differs from the source.
      #
      # Uses `git status --porcelain`, not `git diff`: a rebuild emits a NEW
      # hashed filename, which is an untracked file that `git diff` does not
      # see. Verified by changing a page without rebuilding — `git diff` alone
      # missed it. `.gitkeep` deletions are ignored because Vite clears the
      # output directory on every build.
      - name: Verify the committed bundle matches the source
        run: |
          drift=$(git status --porcelain -- dashboard/public \
                  | grep -v '\.gitkeep$' || true)
          if [ -n "$drift" ]; then
            echo "::error::dashboard/public is out of sync with dashboard/client."
            echo "Run 'npm run build:dashboard' and commit the result."
            echo "$drift"
            exit 1
          fi
          echo "Committed bundle matches the source."

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory only. The 9 known findings are all in the
    # @discordjs/opus -> node-pre-gyp -> tar chain, which is build-time and has
    # no upstream fix. Failing the build on it would mean either pinning a
    # broken version or teaching everyone to ignore a red X.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'

      - name: Report production vulnerabilities
        run: npm audit --omit=dev --audit-level=high || true

      - name: Fail only on NEW runtime-reachable criticals
        run: |
          count=$(npm audit --omit=dev --json 2>/dev/null \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                try{const v=JSON.parse(s).metadata.vulnerabilities;console.log(v.critical||0);}
                catch{console.log(0);}})")
          echo "critical vulnerabilities: $count (known baseline: 1, build-time tar)"
          if [ "$count" -gt 1 ]; then
            echo "::warning::critical vulnerability count rose above the known baseline"
          fi
